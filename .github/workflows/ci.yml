name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMBEDDING_PROVIDER: local_hash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      - name: Run unit tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Enforce retrieval quality gate
        run: |
          python eval_retrieval.py \
            --top-k 3 \
            --min-hybrid-recall 0.90 \
            --output /tmp/finsight-retrieval-report.json

      - name: Enforce citation and abstention gate
        run: |
          python eval_citations.py \
            --min-abstention-recall 0.85 \
            --output /tmp/finsight-citation-report.json
      - name: Enforce router and useful-answer application gates
        run: |
          python -m evaluation.router --quality-gate --output /tmp/finsight-router.json
          python -m evaluation.application --quality-gate --output /tmp/finsight-application.json
      - name: Publish offline evidence
        uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation
          path: /tmp/finsight-*.json
