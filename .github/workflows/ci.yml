name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMBEDDING_PROVIDER: local_hash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Enforce retrieval quality gate
        run: |
          python eval_retrieval.py \
            --top-k 3 \
            --min-hybrid-recall 0.90 \
            --output /tmp/finsight-retrieval-report.json

      - name: Enforce citation and abstention gate
        run: |
          python eval_citations.py \
            --min-abstention-recall 0.80 \
            --output /tmp/finsight-citation-report.json
